name: Cross-platform build

on:
  push:
    branches: [cross-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            configure: cmake -S . -B build -A x64
            artifact: sfa-rich-presence-windows-x64
          - name: Linux x64
            os: ubuntu-latest
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
            artifact: sfa-rich-presence-linux-x64
          - name: macOS Apple Silicon
            os: macos-15
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
            artifact: sfa-rich-presence-macos-arm64
          - name: macOS Intel
            os: macos-15
            configure: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
            artifact: sfa-rich-presence-macos-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Show packaged files
        shell: bash
        run: find build/sfa-rich-presence -maxdepth 4 -type f -print

      - name: Upload Foxhollow mod package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/sfa-rich-presence/
          if-no-files-found: error
